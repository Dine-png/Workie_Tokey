<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'">
  <title>Workie Tokey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="card" class="card">
    <div class="header">
      <span id="collapse-title" class="logo" role="button" tabindex="0" title="컴팩트 모드">◢ Workie Tokey</span>
      <span class="header-buttons">
        <button id="open-settings" class="toggle theme" title="설정">⚙</button>
        <button id="toggle-theme" class="toggle theme" title="라이트/다크 전환">◐</button>
        <button id="toggle-card" class="toggle" title="컴팩트 모드">▾</button>
      </span>
    </div>
    <div id="rows"></div>
    <div class="footer" id="footer">대기 중...</div>

    <div id="settings" class="settings hidden">
      <div class="settings-row settings-toggle" id="set-show-chart">
        <span class="settings-label">사용량 그래프 표시</span>
        <span class="switch"><span class="switch-knob"></span></span>
      </div>
      <div class="settings-row settings-toggle" id="set-autostart">
        <span class="settings-label">시작 시 자동 실행</span>
        <span class="switch"><span class="switch-knob"></span></span>
      </div>
      <div class="settings-row settings-action" id="set-refresh">
        <span class="settings-label">지금 새로고침</span>
        <span class="settings-chevron">↻</span>
      </div>
      <div class="settings-row settings-action" id="set-reset-pos">
        <span class="settings-label">위치 초기화</span>
        <span class="settings-chevron">⌖</span>
      </div>
      <div class="settings-row settings-action danger" id="set-quit">
        <span class="settings-label">종료</span>
        <span class="settings-chevron">✕</span>
      </div>
    </div>
  </div>

  <div id="chip" class="chip hidden" role="button" tabindex="0" title="클릭하면 카드 모드, 끌면 이동">
    <span id="chip-items"></span>
    <button id="toggle-chip" class="toggle" title="카드 모드">▸</button>
  </div>

  <script src="app.js"></script>
</body>
</html>

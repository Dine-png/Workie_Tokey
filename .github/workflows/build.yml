name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 태그 이벤트가 유실되거나 다시 빌드하고 싶을 때 Actions 탭에서 직접 실행한다.
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스에 올릴 태그 (비우면 빌드만 하고 릴리스는 건너뜀)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      # 태그로 트리거됐거나, 수동 실행에서 태그를 지정한 경우에만 릴리스에 올린다.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.exe

      # 릴리스에 안 올리는 실행에서도 결과물을 내려받을 수 있게 남긴다.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkieTokey-exe
          path: dist/*.exe
